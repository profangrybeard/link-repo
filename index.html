<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101014">
<title>Link Repo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101014;
    --panel:#17171F;
    --panel-lift:#1E1E28;
    --rule:#2B2B38;
    --text:#E6E4E0;
    --dim:#8A8796;
    --dimmer:#615F6E;
    --gold:#D4A548;
    --focus:#7FA8C9;
    --pad:clamp(16px, 4vw, 28px);
  }
  *{box-sizing:border-box;}
  #q::-webkit-search-cancel-button{-webkit-appearance:none;display:none;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 var(--pad);}

  /* ---- masthead ---- */
  header{padding:clamp(32px,9vw,64px) 0 20px;}
  h1{
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    font-optical-sizing:auto;
    font-weight:700;
    font-size:clamp(38px,12vw,64px);
    line-height:.95;
    letter-spacing:-.03em;
    margin:0;
  }
  .meta{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:12px;
    color:var(--dimmer);
    letter-spacing:.04em;
    margin-top:14px;
    text-transform:uppercase;
  }
  .meta b{color:var(--dim);font-weight:500;}

  /* ---- search ---- */
  .bar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(var(--ink) 78%, rgba(16,16,20,0));
    padding:10px 0 16px;
  }
  .field{
    display:flex;align-items:center;gap:10px;
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:0 12px;
    transition:border-color .15s ease;
  }
  .field:focus-within{border-color:var(--focus);}
  .field svg{flex:none;color:var(--dimmer);}
  #q{
    flex:1;min-width:0;
    background:none;border:0;outline:none;
    color:var(--text);
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:15px;
    padding:13px 0;
  }
  #q::placeholder{color:var(--dimmer);}
  .kbd{
    flex:none;
    font-family:"IBM Plex Mono",monospace;font-size:11px;
    color:var(--dimmer);
    border:1px solid var(--rule);border-radius:4px;
    padding:2px 6px;
  }
  #clear{
    flex:none;display:none;
    background:none;border:0;cursor:pointer;
    color:var(--dim);font-size:18px;line-height:1;padding:6px;
  }
  .tools{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-top:10px;
    font-family:"IBM Plex Mono",monospace;font-size:11.5px;
    color:var(--dimmer);letter-spacing:.04em;
  }
  .tools button{
    background:none;border:0;cursor:pointer;padding:4px 0;
    font:inherit;color:var(--dim);
    border-bottom:1px solid var(--rule);
  }
  .tools button:hover{color:var(--gold);border-bottom-color:var(--gold);}

  /* ---- category ---- */
  .cat{border-top:1px solid var(--rule);}
  .cat:last-of-type{border-bottom:1px solid var(--rule);}
  .cat[hidden]{display:none;}
  .head{
    width:100%;display:flex;align-items:baseline;gap:14px;
    background:none;border:0;cursor:pointer;
    padding:17px 0;text-align:left;color:inherit;
    font:inherit;
  }
  .head h2{
    flex:1;min-width:0;margin:0;
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    font-weight:500;font-size:clamp(19px,5vw,23px);
    letter-spacing:-.015em;
    transition:color .12s ease;
  }
  .head:hover h2{color:var(--gold);}
  .n{
    flex:none;
    font-family:"IBM Plex Mono",monospace;font-size:12px;
    color:var(--dimmer);
  }
  .chev{
    flex:none;align-self:center;
    color:var(--dimmer);transition:transform .18s ease;
  }
  .cat.open .chev{transform:rotate(90deg);}
  .cat.open .head h2{color:#fff;}

  /* the spine replaces the old icon block: it marks containment rather than
     decorating, and keeps the open state legible when several are expanded */
  .body{
    display:none;
    padding:0 0 22px 20px;
    border-left:1px solid var(--rule);
    margin-left:1px;
  }
  .cat.open .body{display:block;}

  .grp{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--gold);
    margin:18px 0 8px;
  }
  .grp:first-child{margin-top:0;}

  .lnk{
    display:block;text-decoration:none;color:var(--text);
    padding:9px 12px;margin:0 -12px;border-radius:8px;
  }
  .lnk[hidden]{display:none;}
  .lnk:hover,.lnk:focus-visible{background:var(--panel-lift);}
  .lnk .t{display:block;font-size:15.5px;line-height:1.35;}
  .lnk:hover .t{color:var(--gold);}
  .lnk .d{
    display:block;
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;color:var(--dimmer);margin-top:3px;
  }

  .note{
    display:none;padding:56px 0;text-align:center;
    color:var(--dim);
  }
  .note b{display:block;color:var(--text);font-size:17px;margin-bottom:6px;font-weight:500;}
  .note span{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--dimmer);}

  footer{
    padding:40px 0 56px;
    font-family:"IBM Plex Mono",monospace;font-size:11px;
    color:var(--dimmer);letter-spacing:.04em;
  }

  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Link&nbsp;Repo</h1>
    <div class="meta"><b id="total">—</b> links · <b id="cats">—</b> categories · updated <b id="stamp">—</b></div>
  </header>

  <div class="bar">
    <div class="field">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search links" autocomplete="off" spellcheck="false" aria-label="Search links">
      <button id="clear" type="button" aria-label="Clear search">&times;</button>
      <span class="kbd" id="hint">/</span>
    </div>
    <div class="tools">
      <span id="status">Loading</span>
      <button id="toggleAll" type="button">Expand all</button>
    </div>
  </div>

  <main id="list"></main>

  <div id="empty" class="note">
    <b>No links match that</b>
    <span>Try a shorter word, or a domain like unity3d</span>
  </div>

  <div id="failed" class="note">
    <b>The link list didn't load</b>
    <span>Refresh the page to try again</span>
  </div>

  <footer>Link Repo &middot; static page &middot; no tracking</footer>
</div>

<script>
/* The list itself lives in links.json — edit that file, not this one. */

const list = document.getElementById('list');
const q = document.getElementById('q');
const clear = document.getElementById('clear');
const hint = document.getElementById('hint');
const empty = document.getElementById('empty');
const failed = document.getElementById('failed');
const statusEl = document.getElementById('status');
const toggleAll = document.getElementById('toggleAll');

let sections = [];
let total = 0;

function domain(u){
  try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; }
}

function build(data){
  const cats = data.categories || [];

  cats.forEach((cat, ci) => {
    total += cat.items.length;

    const sec = document.createElement('section');
    sec.className = 'cat';

    const head = document.createElement('button');
    head.className = 'head';
    head.type = 'button';
    head.setAttribute('aria-expanded','false');
    head.innerHTML =
      '<h2></h2>' +
      '<span class="n">' + cat.items.length + '</span>' +
      '<svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
    head.querySelector('h2').textContent = cat.name;

    const body = document.createElement('div');
    body.className = 'body';
    body.id = 'b' + ci;
    head.setAttribute('aria-controls', body.id);

    let lastGroup = null;
    cat.items.forEach(it => {
      if(it.g && it.g !== lastGroup){
        const g = document.createElement('div');
        g.className = 'grp';
        g.textContent = it.g;
        body.appendChild(g);
        lastGroup = it.g;
      }
      const a = document.createElement('a');
      a.className = 'lnk';
      a.href = it.u;
      a.target = '_blank';
      a.rel = 'noopener';
      const t = document.createElement('span'); t.className = 't'; t.textContent = it.t;
      const d = document.createElement('span'); d.className = 'd'; d.textContent = domain(it.u);
      a.append(t, d);
      a.dataset.hay = (it.t + ' ' + (it.g||'') + ' ' + cat.name + ' ' + it.u).toLowerCase();
      body.appendChild(a);
    });

    head.addEventListener('click', () => {
      const open = sec.classList.toggle('open');
      head.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    sec.append(head, body);
    list.appendChild(sec);
  });

  sections = [...document.querySelectorAll('.cat')];
  document.getElementById('total').textContent = total;
  document.getElementById('cats').textContent = cats.length;
  document.getElementById('stamp').textContent = data.updated || '—';
  statusEl.textContent = 'Tap a category to open it';
}

function filter(){
  const term = q.value.trim().toLowerCase();
  clear.style.display = term ? 'block' : 'none';
  hint.style.display = term ? 'none' : 'block';
  let shown = 0;

  sections.forEach(sec => {
    const links = [...sec.querySelectorAll('.lnk')];
    let hits = 0;
    links.forEach(a => {
      const match = !term || a.dataset.hay.includes(term);
      a.hidden = !match;
      if(match) hits++;
    });

    // a group label only earns its place when something under it survives
    let node = sec.querySelector('.body').firstChild, currentLabel = null, labelHasHit = false;
    const labels = [];
    while(node){
      if(node.classList && node.classList.contains('grp')){
        if(currentLabel) labels.push([currentLabel, labelHasHit]);
        currentLabel = node; labelHasHit = false;
      } else if(node.classList && node.classList.contains('lnk') && !node.hidden){
        labelHasHit = true;
      }
      node = node.nextSibling;
    }
    if(currentLabel) labels.push([currentLabel, labelHasHit]);
    labels.forEach(([el, keep]) => { el.hidden = !keep; });

    sec.hidden = term && hits === 0;
    if(term){
      sec.classList.toggle('open', hits > 0);
      sec.querySelector('.head').setAttribute('aria-expanded', hits > 0 ? 'true':'false');
    }
    sec.querySelector('.n').textContent = term ? hits : links.length;
    shown += hits;
  });

  empty.style.display = (term && shown === 0) ? 'block' : 'none';
  statusEl.textContent = term
    ? shown + ' of ' + total + ' links'
    : 'Tap a category to open it';
}

q.addEventListener('input', filter);
clear.addEventListener('click', () => { q.value=''; filter(); q.focus(); });

toggleAll.addEventListener('click', () => {
  const anyClosed = sections.some(s => !s.classList.contains('open'));
  sections.forEach(s => {
    s.classList.toggle('open', anyClosed);
    s.querySelector('.head').setAttribute('aria-expanded', anyClosed ? 'true':'false');
  });
  toggleAll.textContent = anyClosed ? 'Collapse all' : 'Expand all';
});

document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); }
  if(e.key === 'Escape' && document.activeElement === q){ q.value=''; filter(); q.blur(); }
});

// touch devices have no slash key to advertise
if(window.matchMedia('(hover:none)').matches) hint.style.display = 'none';

fetch('links.json', {cache:'no-cache'})
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(build)
  .catch(() => {
    statusEl.textContent = '';
    failed.style.display = 'block';
  });
</script>
</body>
</html>
